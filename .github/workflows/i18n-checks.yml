name: Complete multilingual site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source integration
        run: node tools/check-site-i18n.cjs --source-only
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise complete English source site
        env:
          MO_I18N_SCREENSHOT_DIR: test-results/site
        run: node tools/site-browser-check.cjs --source-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-site-screenshots
          path: test-results/site
          if-no-files-found: ignore
