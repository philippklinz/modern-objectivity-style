name: Multilingual pattern checks
on:
  push:
    paths: ['patterns/i18n/**', '.github/workflows/i18n-checks.yml']
  pull_request:
    paths: ['patterns/i18n/**', '.github/workflows/i18n-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check catalogues and behavior
        run: |
          node patterns/i18n/check.cjs
          node --test patterns/i18n/test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise all locales in Chromium
        env:
          MO_I18N_SCREENSHOT_DIR: test-results/i18n
        run: node patterns/i18n/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multilingual-pattern-screenshots
          path: test-results/i18n
          if-no-files-found: ignore
